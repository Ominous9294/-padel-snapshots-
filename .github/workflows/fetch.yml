# Place this file in the repo at:  .github/workflows/fetch.yml
# It runs your padel fetcher on GitHub's always-on servers, computes the
# occupancy rows AT capture time, and commits both the raw JSON and the
# computed rows back to the repo. No secrets needed — Playtomic is a public
# endpoint and GitHub provides the push token automatically.
name: padel-fetch

on:
  schedule:
    # Times are UTC. GitHub cron is best-effort — often drifts by hours and
    # sometimes skips entirely (~1-in-4 recent runs observed missed). Each
    # window now has a primary + backup cron ~2 hours apart, giving two
    # attempts per capture. compute_rows.py is idempotent — the second
    # attempt is a no-op if the first succeeded.
    - cron: "50 10 * * *"     # ~11:50 Europe/London (BST) — midday PRIMARY: AFTERNOON window, today
    - cron: "50 12 * * *"     # ~13:50 Europe/London (BST) — midday BACKUP
    - cron: "50 19 * * *"     # ~20:50 Europe/London (BST) — evening BACKUP: MORNING window, tomorrow
    - cron: "50 21 * * *"     # ~22:50 Europe/London (BST) — evening PRIMARY
  workflow_dispatch:
    # Manual run: optionally force a specific window/date (otherwise auto by hour).
    inputs:
      window:
        description: "morning | afternoon (blank = auto by UTC hour)"
        required: false
        default: ""
      date:
        description: "YYYY-MM-DD (blank = auto: today/tomorrow)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: padel-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Fetch snapshots
        env:
          TZ: Europe/London
        run: |
          chmod +x ./fetch-ci.sh
          ./fetch-ci.sh

      - name: Compute occupancy rows (point-in-time, at capture)
        env:
          TZ: Europe/London
          WINDOW: ${{ github.event.inputs.window }}
          DATE: ${{ github.event.inputs.date }}
        run: |
          python3 ./compute_rows.py

      - name: Commit & push snapshots + rows
        run: |
          git config user.name  "padel-bot"
          git config user.email "actions@users.noreply.github.com"
          git add snapshots manifest.json occupancy_rows.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "snapshots + rows $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
